# PDF Unpack — XcodeGen project spec
# Regenerate the Xcode project with:  xcodegen generate
#
# BEFORE COMMITTING: replace every `com.mlkshkvch` below with your real
# reverse-DNS prefix (e.g. com.emil).
#
# Layout note: the UI-free core lives in its own framework target
# (PDFUnpackKit) so it can be unit-tested cleanly. The app imports it,
# the tests @testable-import it. See the block comments below.

name: PDF Unpack

options:
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    macOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"            # Swift 5 language mode. Bump to "6.0" later if you want strict concurrency.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # On first open in Xcode, pick your Team under Signing & Capabilities (a free
    # personal Apple ID team is fine for local runs). For headless `xcodebuild test`
    # without a team, append CODE_SIGNING_ALLOWED=NO to the command (see README/CLAUDE.md).
    # DEVELOPMENT_TEAM: XXXXXXXXXX   # optional: set your 10-char Team ID to sign headlessly

targets:

  # ─────────────────────────────────────────────────────────────────────
  # UI-FREE CORE (framework). All the risky CGPDF name-tree logic lives here
  # (PDFAttachmentExtractor, PDFDate, models). No SwiftUI/AppKit imports.
  # ─────────────────────────────────────────────────────────────────────
  PDFUnpackKit:
    type: framework
    platform: macOS
    sources:
      - Sources/Kit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mlkshkvch.pdfunpack.kit
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES

  # ─────────────────────────────────────────────────────────────────────
  # THE APP (SwiftUI). `import PDFUnpackKit` to use the core.
  # PDFUnpackKit is embedded + signed into the app automatically.
  # ─────────────────────────────────────────────────────────────────────
  PDF Unpack:
    type: application
    platform: macOS
    sources:
      - Sources/App
    dependencies:
      - target: PDFUnpackKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mlkshkvch.pdfunpack
    info:
      path: Config/Info.plist          # generated by XcodeGen from the properties below
      properties:
        CFBundleDisplayName: PDF Unpack
        CFBundleName: PDF Unpack
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: ""
        # "Open With ▸ PDF Unpack" in Finder for PDFs
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
        # Right-click ▸ Services ▸ "Open in PDF Unpack"
        NSServices:
          - NSMenuItem:
              default: Open in PDF Unpack
            NSMessage: openInPDFUnpack
            NSPortName: PDF Unpack
            NSSendFileTypes:
              - com.adobe.pdf
    entitlements:
      path: Config/PDFUnpack.entitlements   # generated by XcodeGen from the properties below
      properties:
        # Sandbox is OFF for a local personal build (spec §9). Quick Look renders
        # previews in separate, tightly-sandboxed helper processes; when the app
        # is sandboxed those helpers can't reliably read the attachment temp files
        # in our container (text sneaks through, images/CSV hang and render blank).
        # For distribution/notarization, set app-sandbox back to true (plus
        # files.user-selected.read-write) and revisit Quick Look file access.
        com.apple.security.app-sandbox: false

  # ─────────────────────────────────────────────────────────────────────
  # UNIT TESTS. NOT hosted by the app → the test runner is not sandboxed,
  # so tests can read fixtures/sample-protected.pdf straight from the repo
  # via #filePath. Import the core with `@testable import PDFUnpackKit`.
  # (make_fixture.py must have generated the fixture before running tests.)
  # ─────────────────────────────────────────────────────────────────────
  PDFUnpackTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: PDFUnpackKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mlkshkvch.pdfunpack.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PDF Unpack:
    build:
      targets:
        PDFUnpackKit: all
        PDF Unpack: [run, profile, archive, analyze]   # not built during `test` → no app signing needed to run tests
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PDFUnpackTests
