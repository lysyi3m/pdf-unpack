# PDF Unpack — XcodeGen project spec. Regenerate with `make generate`.
# Three targets: UI-free core framework (PDFUnpackKit), the SwiftUI app, and
# tests that @testable-import the core.

name: PDF Unpack

options:
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    macOS: "26.0"

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic

targets:
  PDFUnpackKit:
    type: framework
    platform: macOS
    sources:
      - Sources/Kit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mlkshkvch.pdfunpack.kit
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES

  PDF Unpack:
    type: application
    platform: macOS
    sources:
      - Sources/App
    dependencies:
      - target: PDFUnpackKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mlkshkvch.pdfunpack
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: PDF Unpack
        CFBundleName: PDF Unpack
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: "© 2026 Emil Kashkevich · MIT License"
        # Finder "Open With ▸ PDF Unpack" for PDFs
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
        # Right-click ▸ Services ▸ "Open in PDF Unpack"
        NSServices:
          - NSMenuItem:
              default: Open in PDF Unpack
            NSMessage: openInPDFUnpack
            NSPortName: PDF Unpack
            NSSendFileTypes:
              - com.adobe.pdf
    entitlements:
      path: Config/PDFUnpack.entitlements
      properties:
        # Off for local use: sandboxed Quick Look helpers can't read our temp
        # files. Re-enable (+ files.user-selected.read-write) for notarization.
        com.apple.security.app-sandbox: false

  PDFUnpackTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: PDFUnpackKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mlkshkvch.pdfunpack.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PDF Unpack:
    build:
      targets:
        PDFUnpackKit: all
        PDF Unpack: [run, profile, archive, analyze]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PDFUnpackTests
