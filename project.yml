# PDF Unpack — XcodeGen project spec. Regenerate with `make generate`.
# Three targets: UI-free core framework (PDFUnpackKit), the SwiftUI app, and
# tests that @testable-import the core. The framework and the app build for macOS and iOS;
# the tests run on macOS.

name: PDF Unpack

options:
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.3"
    CURRENT_PROJECT_VERSION: "4"
    CODE_SIGN_STYLE: Automatic

targets:
  PDFUnpackKit:
    type: framework
    platform: auto
    supportedDestinations: [macOS, iOS]
    sources:
      - Sources/Kit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mlkshkvch.pdf-unpack.kit
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES

  PDF Unpack:
    type: application
    platform: auto
    supportedDestinations: [macOS, iOS]
    sources:
      - Sources/App
    dependencies:
      - target: PDFUnpackKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mlkshkvch.pdf-unpack
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Required by the Mac App Store. User-selected read-write covers files chosen in the
        # Open and Save panels; drag and drop, Open With and Services grant access themselves.
        # iOS sandboxes every app, so both are macOS-only.
        "ENABLE_APP_SANDBOX[sdk=macosx*]": "YES"
        "ENABLE_USER_SELECTED_FILES[sdk=macosx*]": readwrite
        # A multiplatform target gets the iOS runpath; a macOS app keeps frameworks in
        # Contents/Frameworks, one level above the executable.
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "$(inherited) @executable_path/../Frameworks"
    # One Info.plist serves both platforms. Each OS ignores the other's keys: NSServices and
    # LSApplicationCategoryType on iOS, the UI* keys on macOS. Xcode adds the minimum OS
    # version key for each platform from its deployment target.
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: PDF Unpack
        CFBundleName: PDF Unpack
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.utilities
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # One window, one document (invariant 7): a second iPad window would render the same
        # shared AppState.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # iOS hands over the original file with a security scope, rather than a copy in the
        # app's Inbox folder.
        LSSupportsOpeningDocumentsInPlace: true
        # Encrypted PDFs are unlocked through CoreGraphics (CGPDFDocument), which is OS-provided
        # encryption and exempt, so App Store Connect does not ask the export-compliance
        # questions on each upload.
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "© 2026 Emil Kashkevich · MIT License"
        # Finder "Open With ▸ PDF Unpack" on macOS; PDF Unpack in the share sheet on iOS
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
        # Right-click ▸ Services ▸ "Open in PDF Unpack"
        NSServices:
          - NSMenuItem:
              default: Open in PDF Unpack
            NSMessage: openInPDFUnpack
            NSPortName: PDF Unpack
            NSSendFileTypes:
              - com.adobe.pdf

  PDFUnpackTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: PDFUnpackKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mlkshkvch.pdf-unpack.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PDF Unpack:
    build:
      targets:
        PDFUnpackKit: all
        PDF Unpack: [run, profile, archive, analyze]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PDFUnpackTests
