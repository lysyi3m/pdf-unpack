# PDF Unpack — XcodeGen project spec. Regenerate with `make generate`.
# Three targets: UI-free core framework (PDFUnpackKit), the SwiftUI app, and
# tests that @testable-import the core.

name: PDF Unpack

options:
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    macOS: "26.0"

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "3"
    CODE_SIGN_STYLE: Automatic

targets:
  PDFUnpackKit:
    type: framework
    platform: macOS
    sources:
      - Sources/Kit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mlkshkvch.pdf-unpack.kit
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES

  PDF Unpack:
    type: application
    platform: macOS
    sources:
      - Sources/App
    dependencies:
      - target: PDFUnpackKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mlkshkvch.pdf-unpack
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: PDF Unpack
        CFBundleName: PDF Unpack
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSApplicationCategoryType: public.app-category.utilities
        # Encrypted PDFs are opened through PDFKit, which is OS-provided encryption and exempt,
        # so App Store Connect does not ask the export-compliance questions on each upload.
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "© 2026 Emil Kashkevich · MIT License"
        # Finder "Open With ▸ PDF Unpack" for PDFs
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
        # Right-click ▸ Services ▸ "Open in PDF Unpack"
        NSServices:
          - NSMenuItem:
              default: Open in PDF Unpack
            NSMessage: openInPDFUnpack
            NSPortName: PDF Unpack
            NSSendFileTypes:
              - com.adobe.pdf
    entitlements:
      path: Config/PDFUnpack.entitlements
      properties:
        # Required by the Mac App Store. user-selected.read-write covers files chosen in the
        # Open and Save panels; drag and drop, Open With and Services grant access themselves.
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true

  PDFUnpackTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: PDFUnpackKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mlkshkvch.pdf-unpack.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PDF Unpack:
    build:
      targets:
        PDFUnpackKit: all
        PDF Unpack: [run, profile, archive, analyze]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PDFUnpackTests
