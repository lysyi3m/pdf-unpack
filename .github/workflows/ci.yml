name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    # Preview image, to match the Xcode used locally. Beta images carry no Actions SLA.
    runs-on: xcode-27
    env:
      # A version path, not the image default, so CI builds with a known toolchain.
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test
        run: make test

      # `make test` compiles only the frameworks and test bundles; the app target is not in the
      # test action, so a broken app would otherwise pass.
      - name: Build
        run: make build
